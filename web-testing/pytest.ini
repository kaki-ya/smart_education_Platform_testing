[pytest]
testpaths = testcases
addopts = -v -s --alluredir=reports/allure-results --clean-alluredir
markers =
    smoke: 冒烟用例

# 失败时的整页截图、页面地址、toast、页面正文由 conftest.py 的
# pytest_runtest_makereport 挂进 allure，所以这里不开 --screenshot（会重复一张）。
#
# 要看每一步的 DOM 快照和网络请求（偶发时序问题用它最省事）：
#     python run.py --tracing=retain-on-failure
# 产物落在 reports/test-results/，用 `playwright show-trace <文件>` 打开。
