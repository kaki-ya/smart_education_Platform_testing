
# 用例总数：30


defaults:
  method: POST
  role: none

cases:

# ============= 课程列表 ==============

- case_id: TC_course_001
  title: 课程列表-默认分页
  method: GET
  path: /api/course/list
  params:
    page: 1
    size: 10
  except_code: 200
  except_field: data.list not_null

- case_id: TC_course_002
  title: 课程列表-关键字筛选
  method: GET
  path: /api/course/list
  params:
    keyword: Java
    page: 1
    size: 10
  except_code: 200
  except_field: data.list not_null

- case_id: TC_course_003
  title: 课程列表-按类型筛选
  method: GET
  path: /api/course/list
  params:
    courseType: 1
    page: 1
    size: 10
  except_code: 200
  except_field: data.list not_null

- case_id: TC_course_004
  title: 课程列表-只看免费
  method: GET
  path: /api/course/list
  params:
    isFree: 1
    page: 1
    size: 10
  except_code: 200
  except_field: data.list not_null

- case_id: TC_course_005
  title: 课程列表-按技术体系筛选
  method: GET
  path: /api/course/list
  params:
    techSystem: Java
    page: 1
    size: 10
  except_code: 200
  except_field: data.list not_null

- case_id: TC_course_006
  title: 课程列表-按报名数排序
  method: GET
  path: /api/course/list
  params:
    sortBy: enroll
    order: desc
    page: 1
    size: 10
  except_code: 200
  except_field: data.list not_null

- case_id: TC_course_007
  title: 课程列表-超大页码
  method: GET
  path: /api/course/list
  params:
    page: 9999
    size: 10
  except_code: 200
  except_field: data.list == []

# ============= 课程详情 ==============

- case_id: TC_course_008
  title: 课程详情-免费课
  method: GET
  path: /api/course/1
  except_code: 200
  except_field:
    - data.course.id not_null
    - data.purchased == true

- case_id: TC_course_009
  title: 课程详情-付费课
  method: GET
  path: /api/course/2
  except_code: 200
  except_field:
    - data.course.id not_null
    - data.purchased == false

- case_id: TC_course_010
  title: 课程详情-含章节列表
  method: GET
  path: /api/course/1
  except_code: 200
  except_field: data.chapters not_empty

- case_id: TC_course_011
  title: 课程详情-不存在
  method: GET
  path: /api/course/999999
  except_code: 400
  except_message: "课程不存在或已下架"

