# ============= 申请开课 ==============

- case_id: TC_course_022
  title: 申请开课-课程名为空
  path: /api/course/applyList
  role: teacher
  body:
    courseName: ""
    price: 99
  except_code: 400
  except_message: "课程名称不能为空"

- case_id: TC_course_023
  title: 申请开课-课程名超长
  path: /api/course/applyList
  role: teacher
  body:
    courseName: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    price: 99
  except_code: 400
  except_message: "课程名称不能超过50个字符"

- case_id: TC_course_024
  title: 申请开课-价格为负
  path: /api/course/applyList
  role: teacher
  body:
    courseName: 自动化测试课程
    price: -1
  except_code: 400
  except_message: "价格不能小于0"

# price 上限 30000，30001 越界。
- case_id: TC_course_025
  title: 申请开课-价格超上限
  path: /api/course/applyList
  role: teacher
  body:
    courseName: 自动化测试课程
    price: 30001
  except_code: 400
  except_message: "价格不能超过30000"

# 成功用例。chapters 上的 @Valid 已补，超长 videoUrl 会走 400 而不是 500。
# 新建课程 status=0，不会出现在 TC_course_001 的公开列表里。
- case_id: TC_course_026
  title: 申请开课-成功
  path: /api/course/applyList
  role: teacher
  body:
    courseName: 自动化测试课程-001
    courseType: 1
    techSystem: Java
    techDirection: 后端
    courseLevel: 初级
    isFree: 0
    price: 99
    description: 由自动化测试创建，审核前 status=0 不出现在前台列表
    reason: 自动化测试
    chapters:
      - chapterName: 第一章 概述
        duration: 10
        videoUrl: /uploads/video/demo.mp4
  except_code: 200

# ============= 申请下架 ==============

# courseId 是必填 query 参数，这里故意不传。
# 当前 GlobalExceptionHandler 用 @ExceptionHandler(Exception.class) 兜底，
# MissingServletRequestParameterException 会被吞成 {"code":500,"message":"系统异常"}。
# 用例断言 400，会保持红色 —— 这是有意留的，用来暴露该缺陷。
# 同类问题还有 TC_job_026 / TC_job_037 / TC_admin_009。
- case_id: TC_course_027
  title: 申请下架-缺courseId
  path: /api/course/offline
  role: teacher
  except_code: 400

- case_id: TC_course_028
  title: 申请下架-课程不存在
  path: /api/course/offline
  role: teacher
  params:
    courseId: 999999
  except_code: 400
  except_message: "课程不存在"

# 缺陷 B（下架不校验归属）修复后，这条的期望从 200 改成 403：
# reset 基线里 course 1 的 teacher_id 是 NULL（系统预置课），
# teacher01 不是它的归属讲师，CourseService.offline 会走到
# ResultCode.FORBIDDEN → 403 无权下架该课程。
# 下架自己的课程（TC_course_026 建的那门）才会返回 200，
# 但 applyList 不返回新建 id，跨用例取 id 这套 YAML 表达不了。
- case_id: TC_course_029
  title: 申请下架-非本人课程被拒绝
  path: /api/course/offline
  role: teacher
  params:
    courseId: 1
    reason: 内容过期，申请下架
  except_code: 403
  except_message: "无权下架该课程"

- case_id: TC_course_030
  title: 申请下架-未登录
  path: /api/course/offline
  params:
    courseId: 1
  except_code: 401
  except_message: "未登录"
