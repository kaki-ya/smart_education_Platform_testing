[pytest]
testpaths = testcases

# 让 config / common / fixtures 这几个包从哪一层跑都 import 得到。
# 不写这条也能跑（pytest 会把 rootdir 插进 sys.path），但那是「碰巧」——
# 换个目录执行 pytest 时 rootdir 会变，插入的目录跟着变。
pythonpath = .

python_files = test_*.py

# --alluredir 的等号两侧不能有空格，否则会被拆成三个参数。
# 原始结果写 reports/allure-results/，生成的 HTML 由 run.py 写 reports/allure-report/。
addopts = -v --alluredir=./reports/allure-results --clean-alluredir

norecursedirs = .venv .idea reports logs __pycache__ .git

# 用例文件里中文多，日志和断言输出不做转义，控制台才看得懂
log_cli_level = WARNING
